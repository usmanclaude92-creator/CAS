name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint + tsc --noEmit)
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build client bundle
        run: npx vite build

      - name: Build server bundle
        run: npx esbuild server.ts --bundle --platform=node --format=cjs --packages=external --outfile=dist/server.cjs

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cas-web-dist
          path: dist/
          retention-days: 7

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle with relative base paths
        env:
          # Vite bakes these into the client bundle at build time. Same
          # values as the Vercel web deployment's project env vars — the
          # anon key is safe to embed client-side (gated by Supabase RLS),
          # which is also why .env.example documents it as public. Set both
          # as repo Actions secrets (Settings > Secrets and variables >
          # Actions): VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npx vite build --base=./

      - name: Copy web build into Android assets
        run: |
          mkdir -p android/app/src/main/assets
          cp -r dist/. android/app/src/main/assets/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Generate app icons from favicon
        run: |
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "android/app/src/main/res/mipmap-${density}"
            cp public/favicon-512x512.png "android/app/src/main/res/mipmap-${density}/ic_launcher.png"
            cp public/favicon-512x512.png "android/app/src/main/res/mipmap-${density}/ic_launcher_round.png"
          done

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CAS-App-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
