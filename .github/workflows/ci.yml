name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint + tsc --noEmit)
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build client bundle
        run: npx vite build

      - name: Build server bundle
        run: npx esbuild server.ts --bundle --platform=node --format=cjs --packages=external --outfile=dist/server.cjs

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cas-web-dist
          path: dist/
          retention-days: 7

  # ==========================================
  # Android app: WebView wrapper around its own bundled web build (see
  # android/ — a self-contained copy of the CAS-App project, not the root
  # web app above). Mirrors android/.github/workflows/main.yml, which
  # GitHub does not run directly since only top-level .github/workflows/
  # files are picked up.
  # ==========================================
  build-android-web:
    name: Build Android Web Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: android/package-lock.json

      - name: Install dependencies
        working-directory: android
        run: npm ci

      - name: Lint and test
        working-directory: android
        run: |
          npm run lint
          npm test

      - name: Build web bundle with relative base paths
        working-directory: android
        run: npx vite build --base=./
        env:
          VITE_SUPABASE_URL: https://krclqyvsgxrcqojfmyaq.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtyY2xxeXZzZ3hyY3FvamZteWFxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwOTg3NDAsImV4cCI6MjEwNTY3NDc0MH0.KEV7_vfYPUmdJyRHE89xrC_BPFyQlw7FT-TSsmsMW5c

      - name: Upload Android Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-web-dist
          path: android/dist/
          retention-days: 7

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: build-android-web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Web Build to Android Assets
        uses: actions/download-artifact@v4
        with:
          name: android-web-dist
          path: android/app/src/main/assets/www

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Generate app icons from favicon
        run: |
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "android/app/src/main/res/mipmap-${density}"
            cp android/public/favicon-512x512.png "android/app/src/main/res/mipmap-${density}/ic_launcher.png"
            cp android/public/favicon-512x512.png "android/app/src/main/res/mipmap-${density}/ic_launcher_round.png"
          done

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CAS-App-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  # ==========================================
  # iOS app: WKWebView wrapper around the same mobile-tailored web bundle
  # android/ builds (build-android-web), so both mobile platforms ship one
  # UI from one web source instead of a second duplicated copy under ios/.
  # Unsigned Simulator build only — installing on a device, TestFlight, or
  # App Store submission additionally needs an Apple Developer Program
  # account and signing certificates/provisioning profiles as repo secrets.
  # ==========================================
  build-ios:
    name: Build iOS App
    runs-on: macos-latest
    needs: build-android-web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Web Build to iOS Resources
        uses: actions/download-artifact@v4
        with:
          name: android-web-dist
          path: ios/CAS/www

      - name: Build for iOS Simulator (unsigned)
        run: |
          xcodebuild build \
            -project ios/CAS.xcodeproj \
            -target CAS \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO
