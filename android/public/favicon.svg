<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" fill="none">
  <defs>
    <!-- Left Leg Gradient: Neon Cyan -> Vivid Sky Blue -> Royal Blue -> Violet -> Neon Magenta -->
    <linearGradient id="artify-left-swoop" x1="60%" y1="0%" x2="10%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="22%" stop-color="#00B8FF" />
      <stop offset="50%" stop-color="#1D68F2" />
      <stop offset="78%" stop-color="#7C3AED" />
      <stop offset="92%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#C026D3" />
    </linearGradient>

    <!-- Right Leg Gradient: Rich Cobalt into Deep Royal Navy -->
    <linearGradient id="artify-right-pillar" x1="25%" y1="0%" x2="75%" y2="100%">
      <stop offset="0%" stop-color="#0080FF" />
      <stop offset="35%" stop-color="#1D4ED8" />
      <stop offset="85%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>

    <!-- Sweeping Highway Bridge Gradient -->
    <linearGradient id="artify-bridge-body" x1="0%" y1="30%" x2="100%" y2="70%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="25%" stop-color="#00D2FF" />
      <stop offset="60%" stop-color="#0077FF" />
      <stop offset="100%" stop-color="#0047BA" />
    </linearGradient>

    <!-- Bridge Top Highlight Rim Gradient -->
    <linearGradient id="artify-rim-highlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="25%" stop-color="#FFFFFF" />
      <stop offset="65%" stop-color="#7DD3FC" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Skyscraper Facet Gradients -->
    <linearGradient id="artify-tower-front" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0F2FE" />
    </linearGradient>

    <linearGradient id="artify-tower-side" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>

    <linearGradient id="artify-tower-roof" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BAE6FD" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- 3D Shadow for Bridge Crossing -->
    <filter id="artify-bridge-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#0b1736" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- ================= 1. RIGHT LEG PILLAR ================= -->
  <path
    d="M 103 14 
       L 122 14 
       L 182 150 
       C 186 158, 184 168, 176 173 
       C 170 178, 144 184, 126 184 
       C 117 184, 113 177, 111 169 
       L 98 126 
       Z"
    fill="url(#artify-right-pillar)"
  />

  <!-- ================= 2. 3D ARCHITECTURAL TOWERS ================= -->
  <!-- Tower 1: Left / Shortest -->
  <g transform="translate(48, 92)">
    <!-- Slanted Roof -->
    <path d="M 0 16 L 8 13 L 18 13 L 11 16 Z" fill="url(#artify-tower-roof)" />
    <!-- Front Face -->
    <path d="M 0 16 L 11 16 L 11 60 L 0 60 Z" fill="url(#artify-tower-front)" />
    <!-- Right Extruded Side -->
    <path d="M 11 16 L 18 13 L 18 60 L 11 60 Z" fill="url(#artify-tower-side)" />
    <!-- Window Line -->
    <line x1="5.5" y1="20" x2="5.5" y2="56" stroke="#0284C7" stroke-width="1.2" stroke-dasharray="3,2" stroke-opacity="0.5" />
  </g>

  <!-- Tower 2: Center / Medium -->
  <g transform="translate(66, 68)">
    <!-- Slanted Roof -->
    <path d="M 0 20 L 9 16 L 22 16 L 14 20 Z" fill="url(#artify-tower-roof)" />
    <!-- Front Face -->
    <path d="M 0 20 L 14 20 L 14 84 L 0 84 Z" fill="url(#artify-tower-front)" />
    <!-- Right Extruded Side -->
    <path d="M 14 20 L 22 16 L 22 84 L 14 84 Z" fill="url(#artify-tower-side)" />
    <!-- Window Lines -->
    <line x1="4.5" y1="25" x2="4.5" y2="78" stroke="#0284C7" stroke-width="1.2" stroke-dasharray="3,2.5" stroke-opacity="0.5" />
    <line x1="9.5" y1="25" x2="9.5" y2="78" stroke="#0284C7" stroke-width="1.2" stroke-dasharray="3,2.5" stroke-opacity="0.5" />
  </g>

  <!-- Tower 3: Right / Tallest High-Rise reaching into Apex -->
  <g transform="translate(86, 40)">
    <!-- Slanted Roof -->
    <path d="M 0 25 L 10 20 L 25 20 L 16 25 Z" fill="url(#artify-tower-roof)" />
    <!-- Front Face -->
    <path d="M 0 25 L 16 25 L 16 112 L 0 112 Z" fill="url(#artify-tower-front)" />
    <!-- Right Extruded Side -->
    <path d="M 16 25 L 25 20 L 25 112 L 16 112 Z" fill="url(#artify-tower-side)" />
    <!-- Window Lines -->
    <line x1="5" y1="30" x2="5" y2="105" stroke="#0284C7" stroke-width="1.4" stroke-dasharray="3.5,3" stroke-opacity="0.5" />
    <line x1="11" y1="30" x2="11" y2="105" stroke="#0284C7" stroke-width="1.4" stroke-dasharray="3.5,3" stroke-opacity="0.5" />
  </g>

  <!-- ================= 3. LEFT MAIN DIAGONAL LEG (Cyan to Purple Swoop) ================= -->
  <path
    d="M 103 14 
       L 122 14 
       L 58 146 
       C 44 174, 24 187, 8 174 
       C -2 166, 1 153, 14 142 
       C 26 132, 44 112, 60 76 
       L 103 14 
       Z"
    fill="url(#artify-left-swoop)"
  />

  <!-- Apex Facet Crisp Edge -->
  <path
    d="M 103 14 L 112 14 L 106 32 L 98 32 Z"
    fill="#FFFFFF"
    fill-opacity="0.45"
  />

  <!-- ================= 4. SWEEPING 3D BRIDGE / HIGHWAY RIBBON ================= -->
  <!-- Underside Depth Shadow -->
  <path
    d="M 11 144 
       C 40 114, 94 92, 154 100 
       C 176 104, 185 112, 188 116 
       C 178 131, 144 139, 106 142 
       C 60 145, 32 152, 11 144 
       Z"
    fill="#022859"
    fill-opacity="0.35"
  />

  <!-- Bridge Main Body -->
  <path
    d="M 12 142 
       C 42 112, 96 90, 156 98 
       C 177 102, 185 110, 188 114 
       C 178 126, 142 136, 104 138 
       C 56 141, 30 149, 12 142 
       Z"
    fill="url(#artify-bridge-body)"
    filter="url(#artify-bridge-shadow)"
  />

  <!-- Bridge Top Glowing Highlight Rim -->
  <path
    d="M 12 142 
       C 42 112, 96 90, 156 98 
       C 177 102, 185 110, 188 114"
    stroke="url(#artify-rim-highlight)"
    stroke-width="3"
    stroke-linecap="round"
    fill="none"
  />

  <!-- ================= 5. EMBEDDED ACCOUNTING CALCULATOR KEYPAD MATRIX ================= -->
  <g transform="translate(122, 125)">
    <!-- Top Row: Wide Functional Key + Vertical Key -->
    <rect x="0" y="0" width="22" height="9" rx="2.5" fill="#FFFFFF" />
    <rect x="25" y="0" width="10" height="21" rx="2.5" fill="#FFFFFF" />

    <!-- Middle Row: 2 Square Keys -->
    <rect x="0" y="12" width="10" height="9" rx="2.5" fill="#FFFFFF" />
    <rect x="12" y="12" width="10" height="9" rx="2.5" fill="#FFFFFF" />

    <!-- Bottom Row: 3 Keys -->
    <rect x="0" y="24" width="10" height="9" rx="2.5" fill="#FFFFFF" />
    <rect x="12" y="24" width="10" height="9" rx="2.5" fill="#FFFFFF" />
    <rect x="25" y="24" width="10" height="9" rx="2.5" fill="#FFFFFF" />
  </g>
</svg>
