name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # ==========================================
  # 1. Build & Validate Web Frontend
  # ==========================================
  build-web:
    name: Build Web App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint and test
        run: |
          npm run lint
          npm test

      - name: Build web bundle with relative base paths
        # Explicit here as defense-in-depth: src/services/supabaseClient.ts
        # also falls back to these same values if unset, but a build should
        # never silently rely on that fallback matching the real project.
        run: npx vite build --base=./
        env:
          VITE_SUPABASE_URL: https://krclqyvsgxrcqojfmyaq.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtyY2xxeXZzZ3hyY3FvamZteWFxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwOTg3NDAsImV4cCI6MjEwNTY3NDc0MH0.KEV7_vfYPUmdJyRHE89xrC_BPFyQlw7FT-TSsmsMW5c

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/
          retention-days: 7

  # ==========================================
  # 2. Build Android Debug APK
  # ==========================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: build-web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Web Build to Android Assets
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: app/src/main/assets/www

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Generate App Icons from Favicon
        run: |
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "app/src/main/res/mipmap-${density}"
            cp public/favicon-512x512.png "app/src/main/res/mipmap-${density}/ic_launcher.png"
            cp public/favicon-512x512.png "app/src/main/res/mipmap-${density}/ic_launcher_round.png"
          done

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CAS-App-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
